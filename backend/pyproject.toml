[project]
name = "kanban-backend"
version = "0.1.0"
description = "Kanban AI back-end"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    # Argon2id. Not passlib: its last release was 1.7.4 in October 2020 and it
    # imports the stdlib crypt module, removed in Python 3.13, which this image
    # runs.
    "pwdlib[argon2]>=0.3",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# pytest puts the test file's directory on sys.path, not the project root, so the
# app package is not importable from tests without this.
pythonpath = ["."]
