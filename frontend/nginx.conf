server {
    # 8080 rather than 80 so the server does not need to start as root.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the entry point. Vite fingerprints the asset filenames, so a
    # stale index.html is the one file that can pin a browser to a build that no
    # longer exists.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;

        # $remote_addr, deliberately, and not $proxy_add_x_forwarded_for.
        #
        # The back-end's rate limiter counts per address. Without a forwarded
        # header every request arrives wearing this container's address and a
        # per-IP limit becomes a global one, so one person mistyping their
        # password locks out everybody.
        #
        # $proxy_add_x_forwarded_for appends to whatever the client sent, which
        # means the header nginx passes on begins with a value the client chose.
        # Anything downstream that reads the left of that list is reading
        # attacker input, and a rate limit keyed on it can be evaded by varying
        # one header. $remote_addr discards what the client sent and asserts the
        # address nginx actually saw.
        #
        # This is right when nginx is the first thing the client reaches. If you
        # put another proxy in front of it, which most container hosts do when
        # they terminate TLS, $remote_addr becomes that proxy and every client
        # again shares one bucket. In that case the real client is inside the
        # incoming X-Forwarded-For, and the correct change is here: take the
        # right-most entry your own proxy appended, not the left-most.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Client-side routing. /boards/<id> is a React Router path with no file
    # behind it, so without this a reload or a shared link answers 404 from
    # nginx and the application never loads.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
