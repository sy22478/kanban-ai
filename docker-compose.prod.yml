name: kanban-ai-prod

# The production stack. Two differences from docker-compose.yml matter more than
# the rest: no source is bind-mounted, so the images are what runs, and the
# back-end publishes no port to the host, so nginx is the only thing that can
# reach it.
#
# TLS is not terminated here. The session cookie is named __Host-session and
# carries Secure, which browsers enforce: served over plain http on anything
# other than localhost, the browser silently refuses to store it and nobody can
# sign in. Put this behind a host or proxy that terminates TLS. That is not a
# recommendation, it is a requirement for the application to work at all.

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: production
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Must be the public origin, scheme included, no trailing slash. The CSRF
      # Origin check compares against this and fails closed, so a wrong value
      # refuses every write rather than accepting a bad one.
      #
      # :? rather than a default, so forgetting it stops the stack with this
      # sentence. Left to itself an unset variable arrives as "", which
      # overrides the setting's default and matches no origin, and the symptom
      # is every write answering 403 for no visible reason.
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:?set this to the public origin, for example https://kanban.example.com}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # The probe hits the database, so an instance that is listening but cannot
    # reach Postgres is reported unhealthy rather than kept in rotation
    # answering 500s. start_period covers the migrations in the command below,
    # which run before uvicorn binds.
    # 127.0.0.1 rather than localhost, which can resolve to ::1 first while the
    # server is bound to IPv4 only. That failure is "connection refused" from
    # inside a container that is working perfectly, and a host reading it would
    # refuse to route traffic to a healthy instance.
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No ports section on purpose. Nothing outside this network can reach the
    # back-end, which is what makes trusting the forwarded headers below safe:
    # the only client able to set them is nginx.
    #
    # --proxy-headers with --forwarded-allow-ips is uvicorn's own handling of
    # X-Forwarded-For, used rather than parsing that header in application code.
    # Trusting it from an arbitrary client is the bypass, so this depends on the
    # isolation above. If the back-end is ever published directly, narrow it to
    # the proxy's address.
    #
    # One worker, deliberately. slowapi keeps its counters in memory, so a
    # second worker would keep its own set and every per-IP limit would become
    # that many times looser. Scaling out means giving the limiter shared
    # storage first; until then the limits are only true with one process.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000
             --workers 1 --proxy-headers --forwarded-allow-ips='*'"

  frontend:
    build:
      context: ./frontend
      target: production
    ports:
      - "${PUBLIC_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    # Through nginx and its /api proxy, so this proves the path a browser
    # actually takes rather than only that nginx is up. wget is in nginx:alpine;
    # curl is not. 127.0.0.1 for the IPv6 reason above, which this container hit
    # for real: nginx listens on IPv4 only, localhost resolved to ::1, and the
    # probe failed against a container that was serving pages correctly.
    #
    # The trade, measured rather than assumed: stopping the database turns this
    # service unhealthy too, so one fault marks two services down and a host may
    # restart nginx for a problem nginx does not have. Probing "/" instead would
    # decouple them, and would also report healthy while a broken proxy_pass
    # made the application unusable. Nothing else would catch that, so the
    # coupling is accepted: when the API is unreachable the app really is down,
    # and this says so.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Still no environment and no env_file. Nothing from .env can reach the
    # bundle, which is what makes "no secret in the client" true by
    # construction rather than by care. The bundle is built at image build time
    # and contains no configuration at all.

volumes:
  pgdata:
