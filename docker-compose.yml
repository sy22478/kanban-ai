name: kanban-ai

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 stores data in a major-version subdirectory of this path.
      # Mounting the pre-18 /var/lib/postgresql/data makes the image refuse to start.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      # Named explicitly now that the Dockerfile has a production target too.
      # Without this, docker builds the last stage in the file.
      target: development
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173}
      # The agent's key, on the back-end service only. The frontend service below
      # still has no environment at all, which is what keeps "no secret in the
      # client bundle" true by construction rather than by remembering.
      # Unset is allowed: the app runs without the agent and that endpoint
      # answers 503.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Anonymous volume so the bind mount above does not hide the image's
      # node_modules, which are installed for Linux rather than Windows.
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
